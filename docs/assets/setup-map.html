<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Porunga Setup Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --page: #e8eaed;
    --card: #ffffff;
    --ink: #15171a;
    --muted: #666b74;
    --line: #2a2d33;
    --mac: #f6f6f5;
    --lab: #f2f6f1;
    --ts: #3b6fd8;
    --ts-bg: #eef3fe;
  }
  body { background: var(--page); color: var(--ink); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px; }
  .frame { background: var(--card); border-radius: 6px; overflow-x: auto; box-shadow: 0 1px 2px rgba(20,24,30,.08), 0 8px 24px rgba(20,24,30,.06); }
  svg { display: block; width: 100%; min-width: 920px; height: auto; }
  .h1 { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 38px; fill: var(--ink); letter-spacing: -.5px; }
  .date { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 14px; fill: #9aa0a8; }
  .t { font-weight: 600; font-size: 15.5px; fill: var(--ink); }
  .t2 { font-weight: 600; font-size: 13px; fill: var(--ink); }
  .s { font-size: 12px; fill: var(--muted); }
  .xs { font-size: 11px; fill: var(--muted); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; fill: var(--muted); }
  .lbl { font-style: italic; font-size: 12px; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }
  .halo-ts { paint-order: stroke; stroke: var(--ts-bg); stroke-width: 5px; stroke-linejoin: round; }
  .hdr { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 17px; fill: var(--ink); }
  .ts { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 3px; fill: var(--ts); }
  .tss { font-size: 11px; fill: var(--ts); }
  .box { fill: var(--card); stroke: var(--line); stroke-width: 1.3; }
  .arr { fill: none; stroke: var(--ink); stroke-width: 1.4; }
  .dash { stroke-dasharray: 4 4; }
  .note { font-size: 12.5px; color: var(--muted); margin: 12px 4px 0; }
</style>
